name: csv file validator

on:
    push:
        branches:
            - main

jobs:
    validates-file:
        runs-on: ubuntu-latest

        steps:
            - name: checkout code / download code
              uses: actions/checkout@v7

            - name: run read programme 
              env:
                USERNAME_ENV: ${{ secrets.USERNAME_ENV }}
                PASSWORD_ENV: ${{ secrets.PASSWORD_ENV }}   
              run: python read.py

